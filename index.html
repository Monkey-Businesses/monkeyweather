<html>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="main.css">

<head>
    <title>Monkey Weather</title>
    <a href="/index.html" style="font-family: 'Lexend'; font-weight: 500; font-size: xx-large; color: black; text-decoration: none;">Monkey Weather</a>
</head>
<body>
    <script src=./script.js></script>
    <div style="font-family: 'Lexend'; font-weight: 500; font-size: large; color: black; text-decoration: none; text-align: center; margin-top: 20px;">
        <p>monkey weather! a simple weather app/website to view weather details (WIP)</p>
    </div>
    <br>
    <br>
    <div style="text-align: center; font-family: lexend;">
        <button class='submit' style="border-radius: 100px; height: 50px; transition-duration: 0.2s;" id="submit" onclick="fetchWeatherData()">use gps location for weather based on your computer (use input entry if not accurate)</button>
    </div>
    <div style="text-align: center; font-family: lexend; margin-top: 50px;">
        <div style="font-size: 75px; margin-bottom: 20px;">or...</div>
        <div style="font-size: x-large;" >input your city, state, and country (state and country abbriviated eg. maryland = MD, united states of america = US)</div>
    </div>
    <div style="font-family: 'Lexend'; font-weight: 500; font-size: large; color: black; text-decoration: none; text-align: center; margin-top: 100px;">
        <div style="margin-bottom: 15px; border-radius: 100px;"><input id="cityInput" name="city input" placeholder="city"></div>
        <div style="margin-bottom: 15px; border-radius: 100px;"><input id="stateInput" name="state input" placeholder="state (eg. maryland = MD)"></div>
        <div style="margin-bottom: 15px; border-radius: 100px;"><input id="countryInput" name="country input" placeholder="country (abbriviate default US)"></div>
        <button class='submit' style="margin-bottom: 15px; border-radius: 100px;" id="submit" onclick="fetchWeatherData()">submit</button>
        <h5 id="error"></h5>
        <h3 id="city"></h3>
        <div id="weather"></div>
    </div>
</body>

</html>
